[project]
name = "ai-second-brain-backend"
version = "0.1.0"
description = "FastAPI and LangGraph backend for the AI Second Brain MVP"
requires-python = ">=3.11,<3.13"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-openai>=0.3,<1",
  "langgraph>=0.2,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.uv]
package = false
