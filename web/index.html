<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="theme-color"
      content="#f7f7f3"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#101312"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Apply a stored theme before first paint. The key must match THEME_STORAGE_KEY in src/lib/theme.ts.
      try {
        var theme = localStorage.getItem("secondbrain.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        // Storage can be blocked; the system preference applies.
      }
    </script>
    <meta
      name="description"
      content="A quieter place to turn curiosity into understanding. Explore your sources, study notes, and connected topics."
    />
    <title>Second Brain — your learning workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
